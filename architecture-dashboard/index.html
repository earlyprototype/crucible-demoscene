<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Crucible v0.7 - 3D Architecture</title>
    <link rel="stylesheet" href="assets/css/architecture.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    
    <!-- Three.js for 3D visualization -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <!-- 3D Architecture Container -->
    <div class="architecture-container-3d" id="architecture-3d">
        <div class="header-3d">
            <div class="header-content">
                <h1>Project Crucible v0.7 - 3D Architecture</h1>
                <p id="render-status" data-state="starting" role="status">Starting 3D renderer</p>
            </div>
        </div>
        
        <!-- 3D Canvas Container -->
        <div id="three-container" class="three-container"></div>
        
        <!-- 3D Controls Overlay -->
        <div class="controls-overlay">
            <output id="focus-name">All services</output>
            <fieldset id="scene-controls" aria-label="Scene controls" disabled>
                <button type="button" data-action="previous" aria-keyshortcuts="[">Previous <kbd>[</kbd></button>
                <button type="button" data-action="next" aria-keyshortcuts="]">Next <kbd>]</kbd></button>
                <button type="button" data-action="reset" aria-keyshortcuts="Home">Reset view <kbd>Home</kbd></button>
            </fieldset>
            <p class="control-hint">Drag to rotate • Scroll to zoom • Click to focus</p>
        </div>
    </div>

    <script src="assets/js/3d-architecture.js"></script>
</body>
</html>
